            <h2>Safari (macOS)</h2>
            <h3>Quick Cache Clearing</h3>
            <p><img style="max-width: 600px;" src="https://cms-lucky.jack-flush.com/assets/2902bde8-f20d-43cd-a518-f8a0e025d6df.png?width=1544&amp;height=182" alt="Screen Shot 2025 06 30 at 4.05.29 Pm"></p>
            <ol>
                <li>
                    <p>Open the&nbsp;<strong>Safari</strong> app on your Mac <img style="max-width: 600px;" src="https://cms-lucky.jack-flush.com/assets/dd062382-b0df-46f6-9ddc-6121eac02f3d.png?width=1208&amp;height=1242" alt="Screen Shot 2025 06 30 at 4.09.25 Pm"><img style="max-width: 300px;" src="https://cms-lucky.jack-flush.com/assets/4b5981e3-cea4-48ff-b23d-6cfc518f8938.jpg?width=658&amp;height=800" alt="2025 06 30 16.36.53"></p>
                </li>
                <li>In the menu, choose&nbsp;<strong>Safari &rarr; Settings&hellip;</strong>, then go to the&nbsp;<strong>Privacy</strong>&nbsp;tab<img style="max-width: 600px;" src="https://cms-lucky.jack-flush.com/assets/f8364f95-1d4c-4ebf-a4d4-1d9f625a3e25.png?width=987&amp;height=558"></li>
                <li>
                    <p>Click the&nbsp;<strong>Manage Website Data&hellip;</strong> button<img style="max-width: 600px;" src="https://cms-lucky.jack-flush.com/assets/cadc8db5-9f93-4f37-b623-3caa61ca6b1f.png?width=1224&amp;height=810"><img style="max-width: 600px;" src="https://cms-lucky.jack-flush.com/assets/714662c9-b4e4-4174-9108-bb2b6361d189.png?width=1242&amp;height=822" alt="Screen Shot 2025 06 30 at 4.46.53 Pm"></p>
                </li>
                <li>
                    <p>Select one or more sites from the list and click&nbsp;<strong>Remove</strong>&nbsp;or&nbsp;<strong>Remove All</strong> to clear their data <img style="max-width: 600px;" src="https://cms-lucky.jack-flush.com/assets/1e7241d3-0076-4e08-8379-95c6ca085074.png?width=1232&amp;height=820" alt="Screen Shot 2025 06 30 at 4.49.10 Pm"></p>
                </li>
            </ol>
