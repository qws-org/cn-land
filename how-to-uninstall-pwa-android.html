        <h2><strong>卸载 PWA 应用（安卓）</strong></h2>
        <ol>
            <li>
                回到你的<strong>主屏幕</strong>，找到 PWA 应用图标。<br />
                <img style="max-width: 300px;" src="https://cms-lucky.jack-flush.com/assets/5cc8e18a-3c03-49b9-9ea8-ce88f7345e3d" alt="主屏幕上的应用图标" />
            </li>
            <li>
                <strong>长按</strong>应用图标，直到弹出菜单出现。<br />
            </li>
            <li>
                在菜单中点击 <strong>“卸载”</strong>。<br />
                <img style="max-width: 300px;" src="https://cms-lucky.jack-flush.com/assets/4f8229e4-302e-4771-aa09-967872af388b" alt="卸载选项" />
            </li>
            <li>
                PWA 应用将从你的设备中移除。<br />
            </li>
        </ol>
