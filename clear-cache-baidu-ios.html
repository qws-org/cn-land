      <h3 data-start="63" data-end="86">百度App（iOS）</h3>
      <p><strong data-start="67" data-end="86"><img style="max-width: 300px;" src="https://cms-lucky.jack-flush.com/assets/fe10d799-7d2c-4c27-983c-4e0e572f7aad.jpg?width=1125&amp;height=2436" alt="2025 07 02 15.42.36"></strong></p>
      <ol data-start="88" data-end="609">
        <li data-start="88" data-end="162">
          <p data-start="91" data-end="162">打开百度App &rarr; 点击右下角的&ldquo;我的&rdquo;选项。 <img style="max-width: 300px;" src="https://cms-lucky.jack-flush.com/assets/8e7f6e08-01e3-4fdd-81b5-64265f1495e9.jpg?width=1125&amp;height=2436" alt="2025 07 02 15.42.33"></p>
        </li>
        <li data-start="163" data-end="218">
          <p data-start="101" data-end="114">点击菜单中的&ldquo;清理缓存&rdquo;。</p>
          <p data-start="166" data-end="218">&nbsp;<img style="max-width: 300px;" src="https://cms-lucky.jack-flush.com/assets/1a0179fe-8b62-489f-8fe0-8f4f5285a8ba.jpg?width=1125&amp;height=2436" alt="2025 07 02 15.42.30"></p>
        </li>
        <li data-start="219" data-end="494">
          <p data-start="116" data-end="152">在缓存页面上，你会看到已占用的空间。点击&ldquo;放心清理&rdquo;以删除所有缓存数据。</p>
          <p data-start="222" data-end="332"><img style="max-width: 300px;" src="https://cms-lucky.jack-flush.com/assets/496cb2c4-766c-46b7-9ed8-b44004fa5e4d.jpg?width=1125&amp;height=2436" alt="2025 07 02 15.42.28"></p>
          <p data-start="337" data-end="386">可选：你也可以选择清理特定类别:</p>
          <ul data-start="390" data-end="494">
            <li data-start="390" data-end="419">
              <p data-start="392" data-end="419">百度专清</p>
            </li>
            <li data-start="423" data-end="442">
              <p data-start="425" data-end="442">图片专清</p>
            </li>
            <li data-start="446" data-end="465">
              <p data-start="448" data-end="465">视频专清</p>
            </li>
            <li data-start="469" data-end="494">
              <p data-start="471" data-end="494">大文件专清</p>
            </li>
          </ul>
        </li>
        <li data-start="496" data-end="609">
          <p data-start="210" data-end="220">出现提示时确认清理。</p>
          <p data-start="499" data-end="609">应用将立即删除缓存数据。</p>
        </li>
      </ol>
