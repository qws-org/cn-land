            <h2 data-start="32" data-end="46">Opera（iOS)</h2>
            <ol data-start="48" data-end="274">
                <li data-start="48" data-end="69">
                    <p data-start="51" data-end="69">打开 <strong data-start="54" data-end="63">Opera</strong> 应用。<img style="max-width: 300px;" src="https://cms-lucky.jack-flush.com/assets/c44ef73e-32fd-4aaa-a1a7-6a9b26c6e7a3.jpg?width=1125&amp;height=2436" alt="2025 07 02 19.28.40"></p>
                </li>
                <li data-start="70" data-end="103">
                    <p data-start="73" data-end="103">点击底部的 <strong data-start="79" data-end="87">个人头像</strong> 或 <strong data-start="90" data-end="100">(⋯) 菜单</strong>。<img style="max-width: 300px;" src="https://cms-lucky.jack-flush.com/assets/4becea5e-0686-4df2-90e6-d021748290cf.jpg?width=1125&amp;height=2436" alt="2025 07 02 19.28.43"></p>
                </li>
                <li data-start="104" data-end="122">
                    <p data-start="107" data-end="122">点击 <strong data-start="110" data-end="119">⚙️ 设置</strong>。<img style="max-width: 300px;" src="https://cms-lucky.jack-flush.com/assets/836d8c45-60c8-4c54-83e2-1b30f44452fc.jpg?width=1125&amp;height=2436" alt="2025 07 02 19.28.46"></p>
                </li>
                <li data-start="123" data-end="147">
                    <p data-start="126" data-end="147">向下滑动，点击 <strong data-start="134" data-end="144">清除浏览数据</strong>。<img style="max-width: 300px;" src="https://cms-lucky.jack-flush.com/assets/39aa8930-19aa-435b-8760-041433ea8d36.jpg?width=1125&amp;height=2436" alt="2025 07 02 19.28.48"></p>
                </li>
                <li data-start="148" data-end="201">
                    <p data-start="151" data-end="156">选择：</p>
                    <ul data-start="160" data-end="201">
                        <li data-start="160" data-end="181">
                            <p data-start="162" data-end="181"><strong data-start="162" data-end="179">Cookies 和网站数据</strong></p>
                        </li>
                        <li data-start="185" data-end="201">
                            <p data-start="187" data-end="201"><strong data-start="187" data-end="199">缓存的图像和文件</strong></p>
                        </li>
                    </ul>
                </li>
                <li data-start="202" data-end="251">
                    <p data-start="205" data-end="251">点击 <strong data-start="208" data-end="214">清除</strong>。<br data-start="215" data-end="218">会弹出确认窗口 &mdash; 点击 <strong data-start="234" data-end="244">清除所选数据</strong> 以确认。<img style="max-width: 300px;" src="https://cms-lucky.jack-flush.com/assets/be2f22ed-ecae-4d8c-a54e-3a44a4e9f431.jpg?width=1125&amp;height=2436" alt="2025 07 02 19.28.51"></p>
                </li>
                <li data-start="252" data-end="274">
                    <p data-start="255" data-end="274">重启 Opera 并重新打开网站。</p>
                </li>
            </ol>
            <p data-start="276" data-end="343"><strong data-start="276" data-end="289">重启 Opera：</strong> 从底部向上滑动（或者双击主页按钮），在应用切换器中找到 Opera，向上滑动关闭它，然后从主屏幕重新打开。<img style="max-width: 300px;" src="https://cms-lucky.jack-flush.com/assets/f1245ae0-510a-447d-8355-d8843189b884.jpg?width=1125&amp;height=2436" alt="2025 07 02 19.28.55"> <img style="max-width: 300px;" src="https://cms-lucky.jack-flush.com/assets/4f7a9c21-b583-4e92-aa1d-d0b43baf8776.jpg?width=1125&amp;height=2436" alt="2025 07 02 19.28.58"></p>
