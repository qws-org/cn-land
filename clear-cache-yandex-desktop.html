        <h3 data-start="112" data-end="140">Yandex 浏览器（桌面版）清除缓存指南</h3>
        <ol data-start="142" data-end="395">
            <li data-start="142" data-end="165">
                <p data-start="145" data-end="165">打开 <strong data-start="148" data-end="162">Yandex 浏览器</strong>。<img style="max-width: 600px;" src="https://cms-lucky.jack-flush.com/assets/d297a6d6-0b4c-47a8-baa8-a910abdee693.png?width=1516&amp;height=1270" alt="截屏2025 07 03 下午1.48.49"></p>
            </li>
            <li data-start="166" data-end="190">
                <p data-start="169" data-end="190">点击右上角的菜单按钮 <strong data-start="180" data-end="187">（☰）</strong>。<img style="max-width: 300px;" src="https://cms-lucky.jack-flush.com/assets/c317cdbb-b2db-417c-a51d-e48838389f49.png?width=678&amp;height=1074" alt="截屏2025 07 03 下午1.49.11"></p>
            </li>
            <li data-start="191" data-end="216">
                <p data-start="194" data-end="216">将鼠标悬停在 <strong data-start="201" data-end="211">&ldquo;历史记录&rdquo;</strong> 上。<img style="max-width: 600px;" src="https://cms-lucky.jack-flush.com/assets/41afbb61-25c2-4638-995a-2f28c245f561.png?width=1326&amp;height=1070" alt="截屏2025 07 03 下午1.49.43"></p>
            </li>
            <li data-start="217" data-end="243">
                <p data-start="220" data-end="243">在子菜单中点击 <strong data-start="228" data-end="240">&ldquo;清除历史记录&rdquo;</strong>。</p>
            </li>
            <li data-start="244" data-end="370">
                <p data-start="247" data-end="276">在弹出的 <strong data-start="252" data-end="262">清除浏览数据</strong> 窗口中，按照以下步骤操作：</p>
                <ul data-start="280" data-end="370">
                    <li data-start="280" data-end="310">
                        <p data-start="282" data-end="310">将 <strong data-start="284" data-end="292">时间范围</strong> 设置为 <strong data-start="297" data-end="307">&ldquo;所有时间&rdquo;</strong>。</p>
                    </li>
                    <li data-start="314" data-end="370">
                        <p data-start="316" data-end="324">仅勾选以下选项：</p>
                        <ul data-start="330" data-end="370">
                            <li data-start="330" data-end="353">
                                <p data-start="332" data-end="353">✅ Cookie 及其他网站数据与插件</p>
                            </li>
                            <li data-start="359" data-end="370">
                                <p data-start="361" data-end="370">✅ 缓存的文件<img style="max-width: 600px;" src="https://cms-lucky.jack-flush.com/assets/b5c2ec4f-7edc-42ea-b43b-586b9319b680.png?width=1114&amp;height=886" alt="截屏2025 07 03 下午1.50.02"></p>
                            </li>
                        </ul>
                    </li>
                </ul>
            </li>
            <li data-start="371" data-end="395">
                <p data-start="374" data-end="395">点击 <strong data-start="377" data-end="385">&ldquo;清除&rdquo;</strong> 按钮完成操作。</p>
            </li>
        </ol>
