            <h3>Android WebView</h3>
            <ol>
                <li>Open Android Settings. Go to the Apps section (or Apps &amp; Notifications).<img style="max-width: 450px;" src="https://cms-lucky.jack-flush.com/assets/5de0fc2f-1289-4c04-9cf7-1a36d060a35c" alt="clear-cache-pwa-android-en-1"></li>
                <li>Find <strong>Android System WebView</strong> in the app list. <img style="max-width: 450px;" src="https://cms-lucky.jack-flush.com/assets/7012ba5d-26be-4742-a417-6ae2cbc99904" alt="clear-cache-pwa-android-en-2"></li>
                <li>Tap on it. Go to the Storage &amp; cache section. <img style="max-width: 450px;" src="https://cms-lucky.jack-flush.com/assets/57935a62-64c1-4afd-a4fd-9112f41b88a6" alt="clear-cache-pwa-android-en-3"></li>
                <li>Tap <strong>Clear cache</strong>. <img style="max-width: 450px;" src="https://cms-lucky.jack-flush.com/assets/119749c8-996e-4dfe-8054-07d6971c71f0" alt="clear-cache-pwa-android-en-4"></li>
                <li>Confirm the action. <img style="max-width: 450px;" src="https://cms-lucky.jack-flush.com/assets/07e90323-0db9-4f9e-badf-376130353958" alt="clear-cache-pwa-android-en-5"></li>
