        <h2><strong>Uninstalling PWA (Android)</strong></h2>
        <ol>
            <li>
                Go to your <strong>home screen</strong> and locate the app icon. <br />
                <img style="max-width: 300px;" src="https://cms-lucky.jack-flush.com/assets/53da881e-5b14-4084-a950-a73f86d6e70c" alt="Home screen with app" />
            </li>
            <li>
                <strong>Tap and hold</strong> the app icon until a menu appears. <br />
            </li>
            <li>
                From the menu, tap <strong>“Uninstall”</strong>. <br />
                <img style="max-width: 300px;" src="https://cms-lucky.jack-flush.com/assets/26935567-6bd4-438f-bdcf-d30f7e7d443f" alt="Uninstall option" />
            </li>
            <li>
                The PWA app will be removed from your device. <br />
            </li>
        </ol>
