            <h2>Opera 浏览器（安卓）</h2>
            <h3>快速清除缓存</h3>
            <ol>
                <li>
                    <p>在安卓设备上打开 <strong>Opera 浏览器</strong>。点击右下角或右上角的齿轮图标 <img style="max-width: 300px;" src="https://cms-lucky.jack-flush.com/assets/28b124da-1ebc-44b0-8831-687051186433" alt="clear-cache-opera-en-1"></p>
                </li>
                <li>
                    <p>在设置菜单中选择&ldquo;隐私与安全&rdquo; <img style="max-width: 300px;" src="https://cms-lucky.jack-flush.com/assets/eac57b32-8834-4fe0-970c-7732c0cf8e7b" alt="clear-cache-opera-en-2"></p>
                </li>
                <li>
                    <p>点击 <strong>清除数据</strong>。<img style="max-width: 300px;" src="https://cms-lucky.jack-flush.com/assets/8538d008-3e5f-4874-8a79-a0e58321881c" alt="clear-cache-opera-en-3"></p>
                </li>
                <li>
                    <p>勾选 <strong>缓存的图片和文件</strong>（以及其他你想删除的数据）。点击 <strong>清除数据</strong> 以确认操作。<img style="max-width: 300px;" src="https://cms-lucky.jack-flush.com/assets/66474d11-9adc-471a-b8d7-90d1925a7761" alt="clear-cache-opera-en-4"></p>
