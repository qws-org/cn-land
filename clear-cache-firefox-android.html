            <h2>Firefox 浏览器（Android）</h2>
            <h3>快速清除缓存</h3>
            <ol>
                <li>
                    <p>在安卓设备上打开 <strong>Firefox 浏览器</strong>，点击右上角的三点图标。<img style="max-width: 300px;" src="https://cms-lucky.jack-flush.com/assets/c815c914-4275-4d59-ae11-5a91ec2cd86b" alt="clear-cache-firefox-zh-1"></p>
                </li>
                <li>
                    <p>在下拉菜单中选择 <strong>设置</strong>。<img style="max-width: 300px;" src="https://cms-lucky.jack-flush.com/assets/9c56182d-7849-49b2-8823-e436b12cc79b" alt="clear-cache-firefox-zh-2"></p>
                </li>
                <li>
                    <p>向下滚动并在&ldquo;隐私与安全&rdquo;部分点击 <strong>删除浏览数据</strong>。<img style="max-width: 300px;" src="https://cms-lucky.jack-flush.com/assets/8fe9af1c-3c2b-478c-b9e4-6bc619a9c364" alt="clear-cache-firefox-zh-3"></p>
                </li>
                <li>
                    <p>勾选 <strong>缓存的图片和文件</strong>（以及你希望删除的其他数据）。然后点击 <strong>删除浏览数据</strong> 以确认操作。<img style="max-width: 300px;" src="https://cms-lucky.jack-flush.com/assets/7ac9533e-17ed-4950-838a-d1300e39faff" alt="clear-cache-firefox-zh-4"></p>
                </li>
            </ol>
