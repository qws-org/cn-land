      <h3>PWA (iOS)</h3>
      <p><img style="max-width: 300px;" src="https://cms-lucky.jack-flush.com/assets/de786a17-8c19-4b99-bed3-40e4376dfaea.jpg?width=1124&amp;height=354" alt="2025 07 01 15.04.30"></p>
      <ol>
        <li>浏览前往 设置 &rarr; Safari<br data-start="14" data-end="17">（iOS 18及更高版本：设置 &rarr; 应用程序 (App)&rarr; Safari）。<img style="max-width: 300px;" src="https://cms-lucky.jack-flush.com/assets/cf337a67-6b26-44ca-9c14-140e144a0a81.jpg?width=1125&amp;height=2436" alt="2025 07 01 15.04.36"><img style="max-width: 300px;" src="https://cms-lucky.jack-flush.com/assets/9439a5f6-5130-44f1-8081-47155c3e2dc5.jpg?width=1125&amp;height=2436" alt="2025 07 01 15.04.39"></li>
      </ol>
      <ol>
        <li>向下滚动，点击<strong>高级 &rarr; 网站数据</strong>。<img style="max-width: 300px;" src="https://cms-lucky.jack-flush.com/assets/ab564d18-40ed-4753-be79-1bedcdd42155.jpg?width=1125&amp;height=2436" alt="2025 07 01 15.04.45"><img style="max-width: 300px;" src="https://cms-lucky.jack-flush.com/assets/a043be32-013c-48af-8002-1c954ad43894.jpg?width=1125&amp;height=2436" alt="2025 07 01 15.04.48"></li>
      </ol>
      <ol>
        <li>找到您的域名（或使用搜索），向左滑动并点击<strong>删除</strong>。<img style="max-width: 300px;" src="https://cms-lucky.jack-flush.com/assets/a86bb4d1-dfc9-4558-8fb8-152be4184a7b.jpg?width=1125&amp;height=2436" alt="2025 07 01 15.04.53"><img style="max-width: 300px;" src="https://cms-lucky.jack-flush.com/assets/261337a6-b31f-472b-be26-acab387be6da.jpg?width=1125&amp;height=2436" alt="2025 07 01 15.04.56"></li>
      </ol>
      <ol>
        <li>重新启动 Safari 并重新打开网站。<br data-start="70" data-end="73">重启 Safari 方法：从屏幕底部上滑（或双击 Home 键），在应用切换器中找到 Safari，向上滑动关闭它，然后从主屏幕重新打开。<img style="max-width: 300px;" src="https://cms-lucky.jack-flush.com/assets/be52973d-3ce3-42af-a055-a17062ddab56.jpg?width=591&amp;height=1280" alt="2025 07 01 15.05.00"><img style="max-width: 300px;" src="https://cms-lucky.jack-flush.com/assets/6096f72f-26e6-4aec-a10d-0d3570e36a5b.jpg?width=591&amp;height=1280" alt="2025 07 01 15.05.02"></li>
      </ol>
      <blockquote>
        <p>或：前往<strong>设置 &rarr; Safari &rarr; 清除历史记录与网站数据</strong> &mdash; 一键删除所有相关数据（包括 Cookie 和浏览记录）。<img style="max-width: 300px;" src="https://cms-lucky.jack-flush.com/assets/a14961af-5c8a-4a78-a1b3-dc2a87871608.jpg?width=1125&amp;height=2436" alt="2025 07 01 15.04.42"></p>
      </blockquote>
