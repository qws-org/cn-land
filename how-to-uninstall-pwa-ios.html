    <div class="text-markdown">
        <h2><strong>如何删除 PWA 应用（iOS）</strong></h2>
        <ol>
            <li>
                回到你的<strong>主屏幕</strong>，找到 PWA 应用图标。<br />
                <img style="max-width: 300px;" src="https://cms-lucky.jack-flush.com/assets/20d55004-e426-4eff-8f35-c8198ce981e7" alt="主屏幕上的 PWA 图标" />
            </li>
            <li>
                <strong>长按</strong>图标，直到出现菜单或图标开始抖动。
            </li>
            <li>
                点击 <strong>“移除 App”</strong> 或 <strong>“删除书签”</strong>。<br />
                <img style="max-width: 300px;" src="https://cms-lucky.jack-flush.com/assets/375f2fdb-3285-4580-a3c2-72ebb5648861" alt="移除 App 选项" />
            </li>
            <li>
                点击 <strong>“删除”</strong> 进行确认。<br />
                <img style="max-width: 300px;" src="https://cms-lucky.jack-flush.com/assets/79ebc03e-2757-428a-a9c0-c2ca531a4aae" alt="确认删除" />
            </li>
            <li>
                PWA 应用将从你的设备中移除。<br />
                <img style="max-width: 300px;" src="https://cms-lucky.jack-flush.com/assets/12793f29-ffa2-4aa6-92e9-4539c5277046" alt="删除完成" />
            </li>
        </ol>
    </div>
