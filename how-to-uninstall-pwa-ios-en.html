        <h2><strong>How to Delete a PWA on iOS</strong></h2>
        <ol>
            <li>Go to your <strong>home screen</strong> and locate the PWA app icon. <img style="max-width: 300px;" src="https://cms-lucky.jack-flush.com/assets/71f6ce2c-7efe-426d-833a-60ecc7545fe5" alt="2025 07 14 18.55.35"></li>
            <li><strong>Tap and hold</strong> the icon until a menu appears or the icons start to jiggle. </li>
            <li>Tap <strong>“Remove App”</strong> or <strong>“Delete Bookmark”</strong>.<img style="max-width: 300px;" src="https://cms-lucky.jack-flush.com/assets/327880a0-51dc-4389-8108-35d81b7f79eb" alt="2025 07 14 19.28.01"> </li>
            <li>Confirm by tapping <strong>“Delete”</strong>. <img style="max-width: 300px;" src="https://cms-lucky.jack-flush.com/assets/f8bd48b5-c2bc-407d-ab9b-3864b7d62ac9" alt="2025 07 14 19.28.01"></li>
            <li>The PWA will be removed from your device. <img style="max-width: 300px;" src="https://cms-lucky.jack-flush.com/assets/b3d99225-b40a-4f59-84c7-d1564256d092" alt="2025 07 14 19.28.01"></li>
        </ol>
