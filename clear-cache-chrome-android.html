            <h2><strong>Chrome (android)</strong></h2>
            <h3><strong>快速清除缓存</strong></h3>
            <ol>
                <li><strong>打开</strong>手机上的 <strong>Chrome 浏览器</strong>。<img style="max-width: 450px;" src="https://cms-lucky.jack-flush.com/assets/265fd7dc-f5aa-48e1-a48f-33d57e395085" alt="clear-cache-chrome-android-en-1"></li>
                <li><strong>点击</strong>右上角的<strong>三个点（⋮）</strong>。<img style="max-width: 450px;" src="https://cms-lucky.jack-flush.com/assets/c8eee06b-95b3-44cf-833e-730b1043050d" alt="clear-cache-chrome-android-zh-2"></li>
                <li><strong>进入设置</strong>。<img style="max-width: 450px;" src="https://cms-lucky.jack-flush.com/assets/9442d124-ba9e-4cac-b694-d0291982ccaf" alt="clear-cache-chrome-android-zh-3"></li>
                <li>向下滚动并选择 <strong>&ldquo;隐私和安全&rdquo;</strong>。</li>
                <li>点击 <strong>&ldquo;清除浏览数据&rdquo;</strong>。 <img style="max-width: 450px;" src="https://cms-lucky.jack-flush.com/assets/f69f7779-5505-4ab1-b11e-f4d537a8e45e" alt="clear-cache-chrome-android-zh-4"></li>
                <li>在 <strong>&ldquo;基础&rdquo;</strong> 选项卡下：勾选 <strong>&ldquo;缓存的图片和文件&rdquo;</strong>，如有需要，也可以勾选 <strong>&ldquo;Cookies&rdquo;</strong> 和 <strong>&ldquo;浏览记录&rdquo;</strong>。<img style="max-width: 450px;" src="https://cms-lucky.jack-flush.com/assets/00922a8a-d5a0-46a8-8478-62cb34725a8f" alt="clear-cache-chrome-android-zh-5"></li>
                <li>在顶部选择时间范围，例如 <strong>&ldquo;所有时间&rdquo;</strong>。</li>
                <li>点击 <strong>&ldquo;清除数据&rdquo;</strong>。</li>
            </ol>
