      <h3 data-start="92" data-end="115">Opera（桌面版）清除缓存指南</h3>
      <ol data-start="117" data-end="364">
        <li data-start="117" data-end="139">
          <p data-start="120" data-end="139">打开 <strong data-start="123" data-end="136">Opera 浏览器</strong>。<img style="max-width: 600px;" src="https://cms-lucky.jack-flush.com/assets/893ae943-9d45-4bab-87e6-5f956c833f8f.png?width=1342&amp;height=1234" alt="截屏2025 07 03 下午1.50.41"></p>
        </li>
        <li data-start="140" data-end="164">
          <p data-start="143" data-end="164">点击右上角的菜单按钮 <strong data-start="154" data-end="161">（&equiv;）</strong>。</p>
        </li>
        <li data-start="165" data-end="190">
          <p data-start="168" data-end="190">向下滚动，找到 <strong data-start="176" data-end="187">&ldquo;隐私与安全&rdquo;</strong>。</p>
        </li>
        <li data-start="191" data-end="228">
          <p data-start="194" data-end="228">找到 <strong data-start="197" data-end="207">&ldquo;浏览数据&rdquo;</strong>，点击旁边的 <strong data-start="214" data-end="222">&ldquo;清除&rdquo;</strong> 按钮。<img style="max-width: 300px;" src="https://cms-lucky.jack-flush.com/assets/ba67113f-d611-4f2e-a949-5aa5bd34bee6.png?width=768&amp;height=1088" alt="截屏2025 07 03 下午1.51.07"></p>
        </li>
        <li data-start="229" data-end="337">
          <p data-start="232" data-end="246">在弹出窗口中，进行以下设置：</p>
          <ul data-start="250" data-end="337">
            <li data-start="250" data-end="278">
              <p data-start="252" data-end="278">将 <strong data-start="254" data-end="262">时间范围</strong> 设置为 <strong data-start="267" data-end="277">&ldquo;所有时间&rdquo;</strong>。</p>
            </li>
            <li data-start="282" data-end="337">
              <p data-start="284" data-end="291">勾选以下选项：</p>
              <ul data-start="297" data-end="337">
                <li data-start="297" data-end="317">
                  <p data-start="299" data-end="317">✅ Cookie 及其他网站数据</p>
                </li>
                <li data-start="323" data-end="337">
                  <p data-start="325" data-end="337">✅ 缓存的图片和文件<img style="max-width: 600px;" src="https://cms-lucky.jack-flush.com/assets/f02caec3-7bc0-41ed-a7fb-1ef1df9ec0b8.png?width=1070&amp;height=994" alt="截屏2025 07 03 下午1.51.36"></p>
                </li>
              </ul>
            </li>
          </ul>
        </li>
        <li data-start="338" data-end="364">
          <p data-start="341" data-end="364">点击 <strong data-start="344" data-end="354">&ldquo;删除数据&rdquo;</strong> 按钮完成清除。</p>
        </li>
      </ol>
