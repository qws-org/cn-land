        <h2><strong>PWA 安装指南（安卓）</strong></h2>
        <ol>
            <li>
                在你的<strong>浏览器</strong>中打开 <a href="https://play.yuepuke.com/" target="_blank">该网站</a>。<br />
                <img style="max-width: 300px;" src="https://cms-lucky.jack-flush.com/assets/9c2717c4-bd3c-4151-b9b0-d5ffa0d74328" alt="打开网站" />
            </li>
            <li>
                点击浏览器右上角的<strong>菜单图标</strong>（三个竖点 ⋮）。<br />
                <img style="max-width: 300px;" src="https://cms-lucky.jack-flush.com/assets/902eb306-795f-416c-a416-52a0bce04a62" alt="打开菜单" />
            </li>
            <li>
                在菜单中点击 <strong>“添加到主屏幕”</strong>。<br />
            </li>
            <li>
                会弹出一个窗口，显示两个选项：<strong>“安装”</strong> 或 <strong>“创建快捷方式”</strong>。<br />
                请选择 <strong>“安装”</strong>，以原生应用方式进行安装。<br />
                <img style="max-width: 300px;" src="https://cms-lucky.jack-flush.com/assets/8bda7b48-3d4f-462c-865d-19fb8f150cc0" alt="添加到主屏幕" />
            </li>
            <li>
                再次弹出提示窗口时，点击 <strong>“安装”</strong> 或 <strong>“添加”</strong> 进行确认。<br />
                <img style="max-width: 300px;" src="https://cms-lucky.jack-flush.com/assets/8481befa-76d9-4968-ab10-6997a2046c86" alt="确认安装" />
            </li>
            <li>
                现在，该应用将显示在你的<strong>主屏幕</strong>上。<br />
                <img style="max-width: 300px;" src="https://cms-lucky.jack-flush.com/assets/5cc8e18a-3c03-49b9-9ea8-ce88f7345e3d" alt="安装完成" />
            </li>
        </ol>
    </div>
</div>
