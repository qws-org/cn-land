            <h2>Yandex 浏览器（安卓）</h2>
            <h3>快速清除缓存</h3>
            <ol>
                <li>
                    <p>打开 Yandex 浏览器。<img style="max-width: 300px;" src="https://cms-lucky.jack-flush.com/assets/401e1248-d6af-412c-85dd-b60a03796e60" alt="clear-cache-yandex-android-en-1"></p>
                </li>
                <li>
                    <p>点击右下角的三条线，然后选择设置（⚙️）。<img style="max-width: 300px;" src="https://cms-lucky.jack-flush.com/assets/51fb98ca-6187-4888-a408-d7a3fee6f7ff" alt="clear-cache-yandex-android-en-2"></p>
                </li>
                <li>
                    <p>进入&ldquo;隐私&rdquo;部分。<img style="max-width: 300px;" src="https://cms-lucky.jack-flush.com/assets/413d97d4-b4d2-4301-9306-8b82cc054829" alt="clear-cache-yandex-android-en-3"></p>
                </li>
                <li>
                    <p>点击&ldquo;清除数据&rdquo;。<img style="max-width: 300px;" src="https://cms-lucky.jack-flush.com/assets/3973af23-506c-40d2-8919-3144b2ed2c41" alt="clear-cache-yandex-android-en-4"></p>
                </li>
                <li>
                    <p>勾选&ldquo;缓存的文件&rdquo;（以及其他你想要删除的数据）。<br>点击&ldquo;删除数据&rdquo;并确认操作。<img style="max-width: 300px;" src="https://cms-lucky.jack-flush.com/assets/9181cf9d-0d4a-4ca0-9e3d-b389d530e310" alt="clear-cache-yandex-android-en-5"></p>
                </li>
            </ol>
