    <h3>Chrome (iOS)</h3>
    <p><img style="max-width: 300px;" src="https://cms-lucky.jack-flush.com/assets/1d6e4630-e492-4acb-a719-eb689a01c351.jpg?width=1125&amp;height=2436" alt="2025 07 01 00.09.20"></p>
    <ol>
      <li>打开 Chrome，点击右下角三点图标（⋯）&rarr;&nbsp;<strong>设置</strong>。<img style="max-width: 300px;" src="https://cms-lucky.jack-flush.com/assets/e90dc4da-e39c-40ca-a4bc-a2baba88155f.jpg?width=1125&amp;height=2436" alt="2025 07 01 00.09.05"><img style="max-width: 300px;" src="https://cms-lucky.jack-flush.com/assets/712bb395-33a0-441a-8f36-13e0a8de21f7.jpg?width=1125&amp;height=2436" alt="2025 07 01 00.09.01"></li>
    </ol>
    <ol>
      <li>进入<strong>隐私 &rarr; 清除浏览数据</strong>。<img style="max-width: 300px;" src="https://cms-lucky.jack-flush.com/assets/35b30085-8cdd-4e0b-a709-a31af3637b61.PNG?width=1125&amp;height=1321"></li>
    </ol>
    <ol>
      <li>仅勾选<strong>缓存的图片和文件</strong>，然后点击<strong>清除浏览数据</strong>。<img style="max-width: 300px;" src="https://cms-lucky.jack-flush.com/assets/3b65a7c5-7ee1-4de0-8592-b29eef2cb259.PNG?width=1125&amp;height=1847"><img style="max-width: 300px;" src="https://cms-lucky.jack-flush.com/assets/8333a8e5-e8eb-4718-a9e6-12b8957e69b0.jpg?width=1125&amp;height=2436" alt="2025 07 01 00.08.55"></li>
    </ol>
    <blockquote>
      <p><strong>注意:</strong>，iOS 上的 Chrome 使用 Safari 的内核，因此 Service Worker 数据会存储在 WebKit 的共享存储中。</p>
    </blockquote>
