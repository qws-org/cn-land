      <h2>Safari（macOS）</h2>
      <h3>快速清除缓存</h3>
      <p><img style="max-width: 600px;" src="https://cms-lucky.jack-flush.com/assets/2902bde8-f20d-43cd-a518-f8a0e025d6df.png?width=1544&amp;height=182" alt="Screen Shot 2025 06 30 at 4.05.29 Pm"></p>
      <ol>
        <li>在 Mac 上打开&nbsp;<strong>Safari</strong> 应用程序 <img style="max-width: 600px;" src="https://cms-lucky.jack-flush.com/assets/31dcc1a2-f6cd-426a-975f-2316c597532e.png?width=1198&amp;height=1248" alt="截屏2025 07 01 上午12.27.37"><img style="max-width: 300px;" src="https://cms-lucky.jack-flush.com/assets/163c7f68-6e1f-4f40-96f7-3479777bff8c.jpg?width=460&amp;height=774" alt="2025 07 01 14.58.34"></li>
        <li>在菜单中选择&nbsp;<strong>Safari &rarr; 设置&hellip;</strong>，然后切换到&nbsp;<strong>隐私</strong> 选项卡 <img style="max-width: 600px;" src="https://cms-lucky.jack-flush.com/assets/05684be5-2e17-4bd1-bb00-2268989f1230.png?width=1022&amp;height=538" alt="截屏2025 07 01 上午12.30.59"></li>
        <li>点击&nbsp;<strong>管理网站数据&hellip;</strong>&nbsp;按钮<img style="max-width: 600px;" src="https://cms-lucky.jack-flush.com/assets/41948522-ae30-4995-9c4b-3c097dacc756.png?width=1222&amp;height=802"><img style="max-width: 600px;" src="https://cms-lucky.jack-flush.com/assets/c6a37eb7-c2dc-4247-9b2f-cd52ef9fc8aa.png?width=1222&amp;height=818" alt="截屏2025 07 01 上午12.30.09"></li>
        <li>从列表中选择一个或多个网站，然后点击&nbsp;<strong>移除</strong>&nbsp;或&nbsp;<strong>全部移除</strong>&nbsp;以清除其数据<img style="max-width: 600px;" src="https://cms-lucky.jack-flush.com/assets/94452c3d-4223-4de6-b764-2c05f94d3005.png?width=1224&amp;height=816" alt="截屏2025 07 01 上午12.30.21"></li>
      </ol>
